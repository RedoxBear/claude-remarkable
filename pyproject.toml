[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-remarkable"
version = "0.1.0"
description = "SSH + cloud library for Remarkable 2 — push PDFs, pull annotations, render overlays"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",        # SSH transport
    "httpx>=0.27",          # Remarkable Connect cloud API
    "rmscene>=0.5",         # Parse .rm v6 stroke files
    "pypdf>=4.0",           # PDF read/write
    "reportlab>=4.1",       # PDF annotation overlay rendering
    "click>=8.1",           # CLI
    "mcp>=1.0",             # MCP server protocol
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
rm-bridge = "rm_bridge.cli:main"
rm-bridge-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["rm_bridge", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
